name = "findraw-backend"
main = "src/index.js"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[ratelimits]]
name = "EDGE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[durable_objects.bindings]]
name = "FINDRAW_ADMISSION"
class_name = "FindrawAdmission"

[[durable_objects.bindings]]
name = "FINDRAW_SESSION"
class_name = "FindrawSession"

[[durable_objects.bindings]]
name = "FINDRAW_ROOM"
class_name = "FindrawRoom"

[[durable_objects.bindings]]
name = "FINDRAW_COMMUNITY"
class_name = "FindrawCommunity"

[[durable_objects.bindings]]
name = "FINDRAW_MATCHMAKER"
class_name = "FindrawMatchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FindrawSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FindrawRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["FindrawCommunity"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["FindrawMatchmaker"]

[[durable_objects.bindings]]
name = "FINDRAW_CHANNEL"
class_name = "FindrawChannel"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["FindrawChannel"]

[[migrations]]
tag = "v6-security"
new_sqlite_classes = ["FindrawAdmission"]

[vars]
FRONTEND_URL = "https://findraw.pages.dev"
TWITCH_REDIRECT_URI = "https://findraw.pages.dev/auth/twitch/callback"
DISABLE_NEW_ROOMS = "0"
DISABLE_COMMUNITY_WRITES = "0"
# Configure TURNSTILE_SITE_KEY (public) and TURNSTILE_SECRET_KEY (secret) before launch.
